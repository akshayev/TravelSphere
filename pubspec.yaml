name: travelsphere
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.10.7 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^3.10.1
  cloud_firestore: ^5.6.1
  firebase_auth: ^5.4.1
  firebase_storage: ^12.4.1
  provider: ^6.1.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  cached_network_image: ^3.3.1
  image_picker: ^1.0.7
  fl_chart: ^0.66.0
  intl: ^0.19.0
  geolocator: ^11.0.0
  share_plus: ^7.2.1
  google_sign_in: ^6.2.1
  google_fonts: ^8.0.1
  flutter_staggered_animations: ^1.1.1
  shimmer: ^3.0.0
  glass_kit: ^4.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
